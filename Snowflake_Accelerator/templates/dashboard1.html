<!DOCTYPE html>
<html>
<head>
<title>Enterprise Logistics Control Tower</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: #0f172a;
    color: white;
}

.container {
    width: 95%;
    margin: auto;
    padding: 20px;
}

h2 { color: #38bdf8; }

.cards {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.value {
    font-size: 28px;
    color: #38bdf8;
}

.alerts {
    margin-top: 20px;
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
}

.full { margin-top: 20px; }

.box {
    background: #1e293b;
    border-radius: 10px;
    padding: 15px;
}

#map {
    height: 400px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #334155;
}

th { color: #38bdf8; }

.charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

canvas {
    width:100% !important;
    height:300px !important;
}

select, button {
    padding: 8px;
    border-radius: 6px;
    border: none;
}

/* RESULT GRID */
.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.result-card {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}

/* HUB GRID */
.hub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 10px;
    margin-top: 10px;
}

.hub-card {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
}

/* ROUTE GRID */
.route-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.route-card {
    background: #0f172a;
    padding: 8px 12px;
    border-radius: 8px;
}

</style>
</head>

<body>

<div class="container">

<h2>🚚 Enterprise Logistics Control Tower</h2>

<div style="margin-top:20px;">

<!-- ROUTE ANALYZER -->
<div class="full box" style="margin-bottom:25px;">
    <h3>🔍 Route Analyzer</h3>

    <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="source">
            <option value="">Select Source</option>
        </select>

        <select id="destination">
            <option value="">Select Destination</option>
        </select>

        <button onclick="analyzeRoute()">Analyze</button>

    </div>

    <div id="routeResult"></div>
</div>

<!-- KPI -->
<div class="cards">
    <div class="card">Total<br><span id="total" class="value">0</span></div>
    <div class="card">Transit<br><span id="transit" class="value">0</span></div>
    <div class="card">Delivered<br><span id="delivered" class="value">0</span></div>
    <div class="card">Pending<br><span id="pending" class="value">0</span></div>
</div>

</div>

<!-- Alerts -->
<div class="alerts" id="alerts">Loading alerts...</div>

<!-- MAP -->
<div class="full">
    <div id="map"></div>
</div>

<!-- ORDERS -->
<div class="full box">
    <h3>📦 Active Orders</h3>
    <table id="ordersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Route</th>
                <th>Load</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- CHARTS -->
<div class="charts">
    <div class="box"><canvas id="statusChart"></canvas></div>
    <div class="box"><canvas id="hubChart"></canvas></div>
</div>

</div>

<script>

// MAP
let map = L.map('map').setView([20.5937,78.9629],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let route = [[18.52,73.85],[17.38,78.48],[12.97,77.59]];
let marker = L.marker(route[0]).addTo(map);

let i = 0;
setInterval(()=>{
    i = (i+1)%route.length;
    marker.setLatLng(route[i]);
},2000);


// DROPDOWN LOAD
function loadLocations(){
fetch('/get_locations')
.then(res=>res.json())
.then(data=>{
    console.log("Locations:", data);

    let src = document.getElementById("source");
    let dst = document.getElementById("destination");

    src.innerHTML = '<option value="">Select Source</option>';
    dst.innerHTML = '<option value="">Select Destination</option>';

    data.forEach(loc=>{
        let opt1 = document.createElement("option");
        opt1.value = loc;
        opt1.text = loc;

        let opt2 = document.createElement("option");
        opt2.value = loc;
        opt2.text = loc;

        src.appendChild(opt1);
        dst.appendChild(opt2);
    });
});
}


// ANALYZE
function analyzeRoute(){
let s = document.getElementById("source").value;
let d = document.getElementById("destination").value;

fetch(`/analyze_route?source=${s}&destination=${d}`)
.then(res=>res.json())
.then(data=>{

let html = `

<div class="result-grid">

    <div class="result-card">
        <h4>📍 Route</h4>
        <p>${s} → ${d}</p>
    </div>

    <div class="result-card">
        <h4>📏 Distance</h4>
        <p>${data.distance || 0} km</p>
    </div>

    <div class="result-card">
        <h4>⏱ Time</h4>
        <p>${data.time || "N/A"} hr</p>
    </div>

</div>

<h4 style="margin-top:15px;">🏢 Available Hubs</h4>
<div class="hub-grid">
`;

data.hubs.forEach(h=>{
html += `
<div class="hub-card">
    <b>${h.name}</b><br>
    Inventory: ${h.inventory}<br>
    Total Vehicles: ${h.total_vehicles}<br>
Available Vehicles: ${h.available_vehicles}<br>
In Use Vehicles: ${h.inuse_vehicles}
</div>
`;
});

html += `</div>

<h4 style="margin-top:15px;">🛣 Available Routes</h4>
<div class="route-grid">
`;

// ✅ ADD CONDITION HERE
if(data.routes.length === 0){
    html += "<p>No routes found</p>";
}else{
    data.routes.forEach(r=>{
    html += `
    <div class="route-card">
        <b>${r.route}</b><br>
        ${r.distance} km | ${r.time} hr
    </div>
    `;
});
}

html += `</div>`;

document.getElementById("routeResult").innerHTML = html;

});
}


// DASHBOARD
let statusChart, hubChart;

function loadDashboard(){
fetch('/dashboard_data')
.then(res=>res.json())
.then(data=>{

document.getElementById("total").innerText = data.total;
document.getElementById("transit").innerText = data.status.IN_TRANSIT;
document.getElementById("delivered").innerText = data.status.DELIVERED;
document.getElementById("pending").innerText =
    data.status.PLACED +
    data.status.PROCESSING +
    data.status.READY_FOR_DISPATCH;

// destroy old charts
if(statusChart) statusChart.destroy();
if(hubChart) hubChart.destroy();

// status chart
statusChart = new Chart(document.getElementById("statusChart"),{
type:'doughnut',
data:{
labels:Object.keys(data.status),
datasets:[{data:Object.values(data.status)}]
},
options:{maintainAspectRatio:false}
});

// hub chart
hubChart = new Chart(document.getElementById("hubChart"),{
type:'bar',
data:{
labels:data.hubs.map(h=>h.hub),
datasets:[{
label:"Inventory",
data:data.hubs.map(h=>h.inventory)
}]
},
options:{maintainAspectRatio:false}
});

});
}


// ALERTS
function loadAlerts(){
fetch('/alerts')
.then(res=>res.json())
.then(data=>{
document.getElementById("alerts").innerHTML =
data.length ? data.join("<br>") : "✅ No Alerts";
});
}


// ORDERS
function loadOrders(){
fetch('/active_orders')
.then(res=>res.json())
.then(data=>{

let html = "";

data.forEach(o => {

    let color = "white";

    if(o.status === "PLACED") color = "orange";
    if(o.status === "PROCESSING") color = "yellow";
    if(o.status === "IN_TRANSIT") color = "blue";
    if(o.status === "DELIVERED") color = "green";

    html += `
        <tr>
            <td>${o.id}</td>
            <td>${o.source} → ${o.dest}</td>
            <td>${o.load}</td>
            <td style="color:${color}">${o.status}</td>
        </tr>
    `;
});

document.querySelector("#ordersTable tbody").innerHTML = html;

});
}


// INITIAL LOAD
loadLocations();
loadDashboard();
loadAlerts();
loadOrders();

// REAL TIME
setInterval(loadDashboard,5000);
setInterval(loadAlerts,7000);
setInterval(loadOrders,5000);

</script>

</body>
</html>
