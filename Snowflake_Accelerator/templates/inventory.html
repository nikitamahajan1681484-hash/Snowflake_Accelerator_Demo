<!DOCTYPE html>
<html>
<head>
    <title>Inventory Check</title>

    <style>
        body {
            font-family: Arial;
           background:
        linear-gradient(rgba(244, 247, 251, 0.86), rgba(244, 247, 251, 0.92)),
        url("{{ url_for('static', filename='inventory.jpg') }}") center / cover fixed;
    color: var(--ink);

            background-size: cover;
        }

        .container {
            width: 600px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
            color: black;
        }

        .box {
            padding: 12px;
            margin: 10px 0;
            background: #eef4ff;
            border-left: 5px solid #ce3e3e;
            border-radius: 6px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
        }

        .full {
            background: #d1fae5;
            border-left: 5px solid green;
        }

        .partial {
            background: #fee2e2;
            border-left: 5px solid red;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg,#575151,#ce3e3e);
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Inventory Analysis</h2>

    <div id="data"></div>

    <button onclick="goBack()">⬅ Back</button>
</div>

<script>

fetch(`/get_inventory/{{ order_id }}`)
.then(res => res.json())
.then(data => {

    if(data.error){
        document.getElementById("data").innerHTML = "❌ Error";
        return;
    }

    let decisionClass = data.decision === "FULL" ? "full" : "partial";

    document.getElementById("data").innerHTML = `
        <div class="box">📦 Order Load: ${data.required}</div>
        <div class="box">📍 Destination: ${data.destination}</div>
        <div class="box">🏢 Hub: ${data.hub}</div>
        <div class="box">📊 Available: ${data.available}</div>
        <div class="box">📈 Incoming: ${data.incoming}</div>
        <div class="box">⚖ Total Available in Destination_Hub: ${data.total}</div>

        <div class="result ${decisionClass}">
            <h3>Decision: ${data.decision}</h3>
        </div>
    `;
});

function goBack(){
    window.history.back();
}

</script>

</body>
</html>
