<!DOCTYPE html>
<html>
<head>
<title>Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { font-family: Arial; }
.container { width: 900px; margin: auto; }

.top-bar { display:flex; gap:10px; margin-bottom:15px; }

input { flex:1; padding:10px; }
button { padding:10px; cursor:pointer; }

.path-stop { padding:10px; margin:5px; border:1px solid #ccc; }
.completed { background:#d1fae5; }
.active { background:#dbeafe; }

#map { height:350px; margin-top:20px; }

.modal {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
}

.modal-content {
    background:white;
    width:400px;
    margin:100px auto;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚚 Tracking</h2>

<div class="top-bar">
    <input type="text" id="orderInput" placeholder="Enter Order ID">
    <button onclick="loadTracking()">Track</button>
</div>

<button id="assignBtn" onclick="openModal()" style="display:none;">
    ➕ Add Load
</button>

<!-- MODAL -->
<div id="loadModal" class="modal">
  <div class="modal-content">
    <h3>Add Load</h3>
    <input type="number" id="loadInput" placeholder="Enter load">
    <br><br>
    <button onclick="submitLoad()">Submit</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<p>Status: <span id="status"></span></p>
<p>Location: <span id="location"></span></p>

<div style="background:#eee;height:10px;">
<div id="progress" style="background:green;height:10px;width:0%"></div>
</div>

<p id="progressText"></p>

<div id="stops"></div>

<div id="map"></div>

</div>

<script>

let orderId = "{{ order_id }}";
let map, marker;

// INIT MAP
function initMap(){
    map = L.map('map').setView([20.5937,78.9629],5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

// UI UPDATE
function updateUI(data){

    document.getElementById("status").innerText = data.status;
    document.getElementById("location").innerText = data.current_location;

    let p = data.progress_percent || 0;

    document.getElementById("progress").style.width = p + "%";
    document.getElementById("progressText").innerText = p + "%";

    let html = "";
    if(data.stops){
        data.stops.forEach(s=>{
            html += `<div class="path-stop ${s.status}">${s.city}</div>`;
        });
    }
    document.getElementById("stops").innerHTML = html;

    // ✅ BUTTON CONTROL
    let btn = document.getElementById("assignBtn");
    btn.style.display = (data.status === "IN_TRANSIT") ? "inline-block" : "none";
}

// MAP
function updateMap(data){

    if(!data.stops || data.stops.length < 2) return;

    let progress = (data.progress_percent || 0)/100;
    let total = data.stops.length - 1;

    let segProgress = progress * total;
    let index = Math.floor(segProgress);
    let local = segProgress - index;

    let from = data.stops[index].city;
    let to = data.stops[index+1]?.city;

    if(!to) return;

    fetch(`/get_coordinates_by_city?city=${from}`)
    .then(r=>r.json())
    .then(src=>{
        fetch(`/get_coordinates_by_city?city=${to}`)
        .then(r=>r.json())
        .then(dst=>{

            let lat = src.lat + (dst.lat - src.lat)*local;
            let lng = src.lng + (dst.lng - src.lng)*local;

            if(marker) map.removeLayer(marker);

            marker = L.marker([lat,lng])
                .addTo(map)
                .bindPopup(data.current_location)
                .openPopup();

            map.setView([lat,lng],6);
        });
    });
}

// LOAD TRACKING
async function loadTracking(){

    let input = document.getElementById("orderInput").value;
    if(input) orderId = input;

    if(!orderId){
        alert("Enter Order ID");
        return;
    }

    const res = await fetch(`/track/${orderId}`);
    const data = await res.json();

    updateUI(data);
    updateMap(data);
}

// MODAL
function openModal(){ document.getElementById("loadModal").style.display="block"; }
function closeModal(){ document.getElementById("loadModal").style.display="none"; }

// SUBMIT LOAD
async function submitLoad(){

    let load = document.getElementById("loadInput").value;

    if(!load || load <= 0){
        alert("Enter valid load");
        return;
    }

    const res = await fetch(`/assign_mid_route/${orderId}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({load_quantity:load})
    });

    const data = await res.json();
    alert(data.message || data.error);

    document.getElementById("loadInput").value="";
    closeModal();
}

// AUTO REFRESH
setInterval(loadTracking,3000);

// INIT
window.onload=function(){
    initMap();
    if(orderId && orderId!=="None"){
        document.getElementById("orderInput").value = orderId;
        loadTracking();
    }
};

</script>

</body>
</html>
